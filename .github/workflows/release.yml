name: 发布安装包

# 一次跑完三件事：编 Android、编 iOS、把两个包挂到 GitHub Release 上。
# 版本号不在这里写死，从 pubspec.yaml 的 version: 读（x.y.z+code），
# tag 自动取 v<version>，所以发版只需要改 pubspec / app_info / 鸿蒙 app.json5。
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 标记为预发布
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# 建 Release、传附件要写权限；其余默认只读
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: 读版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          RAW="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//')"
          VERSION="${RAW%%+*}"
          CODE="${RAW##*+}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RAW" ]; then
            echo "::error::pubspec.yaml 的 version 不含 +code：$RAW"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"       >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION ($CODE)"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # 密钥库不在版本库里（.gitignore 挡着），CI 上从 secrets 还原。
      # 少了这一步 gradle 会退回 debug 签名，装过正式包的人就没法覆盖升级。
      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::缺 secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/kano-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=kano-release.jks
          EOF
          ls -l android/kano-release.jks android/key.properties

      - name: 解析依赖
        run: flutter pub get

      - name: 编译 release APK
        run: flutter build apk --release

      - name: 校验版本号与签名
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging "$APK" | head -1
          # 打印签名证书；出现 Android Debug 说明密钥没生效，直接失败
          CERTS="$("$BT/apksigner" verify --print-certs "$APK" 2>&1 || true)"
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "Android Debug"; then
            echo "::error::APK 用的是 debug 签名，密钥没还原成功"
            exit 1
          fi

      - name: 改名并上传
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk \
             "xiaolubao-${{ needs.meta.outputs.version }}.apk"
          ls -lh xiaolubao-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: xiaolubao-*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS 未签名 IPA
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: 解析依赖
        run: flutter pub get

      # 没有开发者证书，只能出未签名包；安装时用 Sideloadly / AltStore 重签。
      - name: 编译（跳过签名）
        run: flutter build ios --release --no-codesign

      - name: 装进 Payload 打成 ipa
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::没找到 $APP"; ls -R build/ios | head -50; exit 1; }
          rm -rf build/ios/Payload build/ios/unsigned.ipa
          mkdir -p build/ios/Payload
          cp -R "$APP" build/ios/Payload/Runner.app
          (cd build/ios && zip -qry unsigned.ipa Payload)
          cp build/ios/unsigned.ipa "xiaolubao-${{ needs.meta.outputs.version }}-unsigned.ipa"
          ls -lh xiaolubao-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: xiaolubao-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: 建 Release
    needs: [meta, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回两个包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列产物
        run: ls -lh dist

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **版本** ${{ needs.meta.outputs.version }}（versionCode ${{ needs.meta.outputs.code }}）

            | 文件 | 平台 | 装法 |
            |---|---|---|
            | `xiaolubao-${{ needs.meta.outputs.version }}.apk` | Android | 直接安装，可覆盖旧版 |
            | `xiaolubao-${{ needs.meta.outputs.version }}-unsigned.ipa` | iOS 13+ | 未签名，需用 Sideloadly / AltStore 重签 |

            安卓包与历史版本同签名（`kano`），装过旧版的可以直接升级。
            iOS 包是 `--no-codesign` 产物，免费 Apple ID 签名 7 天过期，到期重签即可。
          files: |
            dist/xiaolubao-*.apk
            dist/xiaolubao-*-unsigned.ipa
